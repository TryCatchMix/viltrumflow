# Desarrollo: docker compose up --build
#   Frontend  http://localhost:4200
#   API docs  http://localhost:8000/docs
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-viltrum}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-viltrum}
      POSTGRES_DB: ${DB_NAME:-viltrumflow}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-viltrum} -d ${DB_NAME:-viltrumflow}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${DB_USER:-viltrum}:${DB_PASSWORD:-viltrum}@db:5432/${DB_NAME:-viltrumflow}
      SECRET_KEY: ${SECRET_KEY:-dev-insecure-secret-change-me-please-32chars}
      ENVIRONMENT: development
      BACKEND_CORS_ORIGINS: '["http://localhost:4200"]'
      FRONTEND_URL: http://localhost:4200
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: http://localhost:8000/api/v1/calendar/callback
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
    volumes:
      - ./backend/app:/app/app
      - ./backend/migrations:/app/migrations
      - uploads:/data/uploads
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      target: dev
    restart: unless-stopped
    volumes:
      - ./frontend/src:/app/src
    ports:
      - "4200:4200"
    depends_on:
      - backend

volumes:
  postgres_data:
  uploads:
