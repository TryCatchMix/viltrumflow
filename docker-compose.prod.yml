# Producción: docker compose -f docker-compose.prod.yml --env-file .env up -d --build
# El contenedor «web» escucha en HTTP_PORT; pon delante tu terminación TLS (Caddy, Traefik, balanceador…).
services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:?define DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?define DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:?define DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: always
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      SECRET_KEY: ${SECRET_KEY:?define SECRET_KEY}
      ENVIRONMENT: production
      DEBUG: "false"
      BACKEND_CORS_ORIGINS: '["${PUBLIC_URL:?define PUBLIC_URL}"]'
      FRONTEND_URL: ${PUBLIC_URL}
      LOGIN_MAX_ATTEMPTS: ${LOGIN_MAX_ATTEMPTS:-5}
      LOGIN_WINDOW_MINUTES: ${LOGIN_WINDOW_MINUTES:-15}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${PUBLIC_URL}/api/v1/calendar/callback
      GOOGLE_LOGIN_REDIRECT_URI: ${PUBLIC_URL}/api/v1/auth/google/callback
      GOOGLE_LOGIN_ENABLED: ${GOOGLE_LOGIN_ENABLED:-true}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      TCG_VISION_MODEL: ${TCG_VISION_MODEL:-claude-opus-5-5}
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy

  # Copia diaria de la base de datos en BACKUP_DIR (ver «Copias de seguridad» en el README)
  backup:
    image: postgres:16-alpine
    restart: always
    environment:
      PGHOST: db
      PGUSER: ${DB_USER}
      PGPASSWORD: ${DB_PASSWORD}
      PGDATABASE: ${DB_NAME}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
    volumes:
      - ${BACKUP_DIR:-./backups}:/backups
      - ./scripts/backup.sh:/usr/local/bin/backup.sh:ro
      - uploads:/uploads:ro
    entrypoint: ["sh", "/usr/local/bin/backup.sh", "loop"]
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      target: production
    restart: always
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  uploads:
